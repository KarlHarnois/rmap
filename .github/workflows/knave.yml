name: Knave

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  KNAVE_VERSION: "0.20.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: knave-cache
        uses: actions/cache/restore@v4
        with:
          path: &knave-files |
            ~/.cargo/bin/knave
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: knave-${{ env.KNAVE_VERSION }}-${{ runner.os }}
      - name: Install Knave
        run: cargo install knave --version "$KNAVE_VERSION" --locked
      - if: steps.knave-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *knave-files
          key: ${{ steps.knave-cache.outputs.cache-primary-key }}
      - name: Check the layout
        run: knave fmt --check
      - name: Lint
        run: knave lint
      - name: Keep source files under 150 lines
        run: |
          long=$(git ls-files '*.knv' ':!:tests/' | xargs wc -l | awk '$2 != "total" && $1 > 150 {print $2 ": " $1 " lines"}')
          if [ -n "$long" ]; then
            echo "These files pass 150 lines. Move a concept that deserves its own name into its own module:"
            echo "$long"
            exit 1
          fi
      - name: Keep code outside the ledger on its api
        run: |
          if git ls-files '*.knv' ':!:src/ledger/' ':!:tests/' | xargs grep -n '^(use ledger/' | grep -v ':(use ledger/api[ )]'; then
            echo "Code outside src/ledger/ must import only ledger/api."
            exit 1
          fi
      - name: Keep the ledger core free of SQLite
        run: |
          if grep -rn '^(use ledger/sqlite' src/ledger/core; then
            echo "src/ledger/core must not import ledger/sqlite: the core stays pure."
            exit 1
          fi
      - name: Test
        run: knave test
