name: Knave

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  KNAVE_VERSION: "0.20.1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: knave-cache
        uses: actions/cache/restore@v4
        with:
          path: &knave-files |
            ~/.cargo/bin/knave
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: knave-${{ env.KNAVE_VERSION }}-${{ runner.os }}
      - name: Install Knave
        run: cargo install knave --version "$KNAVE_VERSION" --locked
      - if: steps.knave-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *knave-files
          key: ${{ steps.knave-cache.outputs.cache-primary-key }}
      - name: Check the layout
        run: knave fmt --check
      - name: Lint the app
        run: knave lint
      - name: Lint the tasks
        run: |
          status=0
          for task in tasks/*.knv; do
            knave lint "$task" || status=1
          done
          exit $status
      - name: Lint the tests, without needless-type, from a copy that places them under src
        run: |
          copy="$RUNNER_TEMP/test-lint"
          mkdir -p "$copy"
          git archive HEAD | tar -x -C "$copy"
          cp -r tests/. "$copy/src/"
          sed -i 's/(needless-type [a-z]*)/(needless-type allow)/' "$copy/project.knv"
          cd "$copy"
          status=0
          for test in $(cd tests && find . -name '*-test.knv' | sort); do
            knave lint "src/${test#./}" || status=1
          done
          exit $status
      - name: Keep source files under 150 lines
        run: |
          long=$(git ls-files '*.knv' ':!:tests/' | xargs wc -l | awk '$2 != "total" && $1 > 150 {print $2 ": " $1 " lines"}')
          if [ -n "$long" ]; then
            echo "These files pass 150 lines. Move a concept that deserves its own name into its own module:"
            echo "$long"
            exit 1
          fi
      - name: Keep code outside the ledger on its api
        run: |
          if git ls-files '*.knv' ':!:src/ledger/' ':!:tests/' | xargs grep -n '^(use ledger/' | grep -v ':(use ledger/api[ )]'; then
            echo "Code outside src/ledger/ must import only ledger/api."
            exit 1
          fi
      - name: Keep the ledger core pure
        run: |
          if grep -rn '^(use ' src/ledger/core | grep -vE ':\(use ledger/(model|names|refusal|core/[a-z-]+)[ )]'; then
            echo "src/ledger/core may import only ledger/model, ledger/names, ledger/refusal and other core modules: the core stays pure."
            exit 1
          fi
      - name: Keep committed migrations unchanged
        env:
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base=${PULL_REQUEST_BASE:-$PUSH_BEFORE}
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)
          fi
          changed=$(git diff --name-only --diff-filter=MDR "$base" HEAD -- migrations/)
          if [ -n "$changed" ]; then
            echo "These committed migrations changed. Add the next numbered migration instead: a database that already applied a file skips the edit."
            echo "$changed"
            exit 1
          fi
      - name: Test
        run: knave test
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the flake
        run: nix build --print-build-logs
